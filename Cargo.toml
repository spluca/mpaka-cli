[package]
name = "mpaka-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Command-line client for the mPaka code execution API"
repository = "https://github.com/spluca/mpaka-cli"
homepage = "https://mpaka.dev"
readme = "README.md"
publish = false

[[bin]]
name = "mpaka"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = "0.9"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
tar = "0.4"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "9"

[dev-dependencies]
axum = { version = "0.8", features = ["json"] }
